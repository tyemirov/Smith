kind: workflow
governance: mprlab-governor
controller:
  responsibilities:
    - Own user communication, primary-checkout verification, and final reporting.
    - Execute a step in the primary agent when delegation cannot use the primary checkout.
steps:
  - id: commit-preflight
    role: explorer
    execution: conditional_subagent
    workspace: primary
    scope: Inspect repository state and summarize the next safe action before changes.
    controller_handoff: Verify critical repository facts in the primary checkout before staging or committing.
  - id: commit-execution
    role: worker
    execution: conditional_subagent
    workspace: primary
    scope: Stage the full tree, draft the commit message with gix, commit, and push when the remote target is clear.
    controller_handoff: Execute this step in the primary agent unless the worker uses the primary checkout.
