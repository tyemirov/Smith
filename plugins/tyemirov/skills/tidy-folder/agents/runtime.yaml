kind: workflow
governance: mprlab-governor
controller:
  responsibilities:
    - Keep Supervisor and Router responsibilities in the primary agent.
    - Use deterministic helpers for snapshots, moves, restore, and inventory checks.
    - Own the run lock, artifact writes, placement decisions, and final report.
    - Apply the hierarchy comparison before moves.
    - Treat helper role records as mechanical results, not independent review evidence.

delegation:
  selection:
    - "Use one agent for small, clear tasks."
    - "Delegate disjoint evidence scans when parallel work has a useful benefit."
    - "Request an independent Gatekeeper for ambiguous placements, sensitive groups, or removal candidates when delegation is available."
    - "Keep target mutations and shared run artifacts under one owner."
  capability_check:
    - "Before delegation, inspect the active tool's supported model IDs and reasoning levels."
    - "Use the installed shared host assignments only when the host supports each exact pair."
    - "If an assignment is unavailable, report the role, requested pair, and available options."
    - "Keep that delegation blocked until the user selects a supported assignment or explicitly selects single-agent execution."
    - "Continue independent read-only work while a required review is blocked. Keep all moves blocked."
    - "If the host has no delegation capability, use the documented single-agent method unless the user requires independent review."
    - "Record single-agent review as single_agent. Record actual independent review as independent_subagent."
    - "When the host cannot verify a model's availability, record it as unverified and keep that delegation blocked."
  context:
    - "Give each subagent its bounded task, assigned paths, relevant rules, and necessary evidence."
    - "Request concise findings and evidence paths instead of a copy of the full inventory."
    - "Use a fresh or bounded context when the host requires it for model overrides."
    - "Obey the active host concurrency limit."
    - "Wait for all required reviews before execution."
  execution_record:
    - "Record the role, execution method, requested model, requested reasoning, and model availability evidence."
    - "For a spawned agent, record its returned identifier and the actual model and reasoning when exposed."
    - "When actual model metadata is absent, record it as unverified. A request alone does not prove the selected model."
    - "Keep all assignments in the shared Governor contract. Recheck them before delegation and distribution."

steps:
  - id: tidy-folder-preflight
    role: worker
    execution: primary_agent_with_scripts
    workspace: primary
    scope: Establish the target, snapshot, and run lock.
  - id: tidy-folder-scout
    role: explorer
    execution: conditional_subagent
    workspace: primary
    scope: Inspect assigned paths. Return evidence, candidate groups, and unresolved questions.
  - id: tidy-folder-router
    role: worker
    execution: primary_agent
    workspace: primary
    scope: Select destinations. Compare root alternatives and record the chosen hierarchy.
  - id: tidy-folder-gatekeeper
    role: architect
    execution: conditional_subagent
    workspace: primary
    required_review: true
    review_condition: Ambiguous placements, sensitive groups, or removal candidates require independent review.
    scope: Review raw evidence and proposed actions against the task gates. Return specific findings or a clear result.
  - id: tidy-folder-executor
    role: worker
    execution: primary_agent_with_scripts
    workspace: primary
    scope: Apply reviewed actions. Preserve project internals, the lock, the move ledger, and reversible cleanup.
  - id: tidy-folder-audit-and-report
    role: worker
    execution: primary_agent_with_scripts
    workspace: primary
    scope: Verify the inventory and report outcomes, review method, and unresolved limits.
