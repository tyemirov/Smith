kind: workflow
governance: mprlab-governor
controller:
  responsibilities:
    - Own user communication, checkout verification, release changes, publication, and final reporting.
    - Keep publication effects in the primary agent.
steps:
  - id: release-audit
    role: explorer
    execution: conditional_subagent
    workspace: primary
    scope: Inspect the lifecycle and identify the local CI gate, versioning scheme, and complete artifact inventory.
    controller_handoff: Verify findings in the primary checkout before release preparation.
  - id: release-prepare
    role: worker
    execution: primary_agent_with_scripts
    workspace: primary
    scope: Run the local release pipeline and finalize the hashed release artifact.
  - id: release-publish
    role: worker
    execution: primary_agent_with_scripts
    workspace: primary
    scope: Publish and verify the exact prepared refs and payloads.
    controller_handoff: Keep all publication effects in the primary agent.
